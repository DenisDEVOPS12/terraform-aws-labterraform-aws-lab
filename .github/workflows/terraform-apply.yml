name: Terraform Apply

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Terraform Apply (${{ matrix.dir }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.gh_environment }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: dev
            gh_environment: lab
            auth: keys
          - dir: security
            gh_environment: Security
            auth: oidc

    defaults:
      run:
        working-directory: environments/${{ matrix.dir }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (access key)
        if: matrix.auth == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS Credentials (OIDC)
        if: matrix.auth == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

  tag:
    name: Tag deployed commit
    runs-on: ubuntu-latest
    needs: apply

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A PAT is required here instead of the default GITHUB_TOKEN: GitHub
          # does not let pushes made with GITHUB_TOKEN trigger other workflows
          # (anti-recursion safeguard), which would silently stop this tag
          # from ever triggering terraform-apply-prod.yml.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Create and push CalVer tag
        run: |
          VERSION="$(date +'%Y.%m.%d')-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Deploy $VERSION (dev, security) - triggers prod release"
          git push origin "$VERSION"
          echo "Tagged $VERSION"
